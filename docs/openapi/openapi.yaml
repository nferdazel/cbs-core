openapi: 3.1.0
info:
  title: CBS Core API
  version: 1.0.0
  summary: Kontrak HTTP inti CBS Core (BPR/BMT).
  description: |
    Spesifikasi kontrak API `/api/v1` untuk core banking CBS Core.

    ## Autentikasi
    Dua mekanisme dipakai bersamaan oleh klien resmi:

    - **Bearer JWT** (`Authorization: Bearer <access_token>`) — untuk integrasi
      non-browser dan pengujian.
    - **Cookie sesi httpOnly** (`cbs_access_token`) — dipakai web. Cookie
      `cbs_refresh_token` dipakai untuk memperbarui sesi.

    Endpoint publik (`/healthz`, `/api/v1/app-info`, `/api/v1/auth/login`,
    `/api/v1/auth/refresh`) tidak memerlukan autentikasi.

    Semua endpoint di belakang autentikasi juga melewati cakupan buku
    (`institution.book_scope`) dan cakupan unit organisasi (cabang/area/wilayah);
    data di luar cakupan aktor ditolak 403 atau disamarkan 404 pada pembacaan.

    ## CSRF
    Permintaan yang mengubah state (POST/PUT/DELETE) dari klien berbasis cookie
    wajib menyertakan header `X-CSRF-Token` yang nilainya sama dengan cookie
    `csrf_token` (pola double-submit). Klien Bearer murni dapat mengabaikannya.

    ## Amplop respons
    Semua respons sukses memakai amplop
    `{"success": true, "message": "...", "data": ..., "meta": ...}`.
    Respons galat memakai `{"success": false, "error": "..."}`.

    `data` daftar kosong selalu diserialkan sebagai `[]`/`{}`, tidak pernah `null`.
  contact:
    name: Tim CBS Core
servers:
  - url: http://localhost:8080
    description: Pengembangan lokal
  - url: https://api.contoh-bank.id
    description: Produksi (contoh)
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Kesehatan
    description: Health check proses.
  - name: Aplikasi
    description: Identitas aplikasi publik sebelum sesi ada.
  - name: Auth
    description: Sesi, login, refresh, dan logout.
  - name: Staff
    description: Manajemen pegawai (pengguna) dan kata sandi.
  - name: Cabang
    description: Master data cabang dan hierarki unit organisasi.
  - name: Produk
    description: Data referensi produk dan parameter suku bunga/biaya.
  - name: Nasabah
    description: Data CIF/nasabah.
  - name: Rekening
    description: Pembukaan, pembekuan, penutupan, dan mutasi rekening.
  - name: Transaksi
    description: Setoran, penarikan, transfer, pembatalan, dan jurnal.
  - name: Kredit
    description: Pengajuan, persetujuan, pencairan, dan pemeliharaan kredit.
  - name: Agunan
    description: Agunan kredit dan gerbang bobot agunan.
  - name: Koleksi
    description: Penagihan lapangan (jemput bola).
  - name: Deposito
    description: Deposito berjangka (penempatan, akrual, perpanjangan, pencairan).
  - name: Laporan
    description: Laporan keuangan, operasional, OJK, dan KPMM.
  - name: PPAP
    description: Penyisihan penghapusan aset produktif.
  - name: CKPN
    description: CKPN SAK EP, termasuk penilaian individual.
  - name: Integrasi
    description: Gerbang integrasi pihak ketiga (SLIK OJK, Dukcapil).
  - name: Sistem
    description: Tanggal bisnis, setelan instalasi, batas, dan audit.
  - name: Batch
    description: Proses akhir hari/bulan/tahun (EOD/EOM/EOY).
  - name: Izin
    description: Katalog dan pengajuan perubahan izin.
  - name: Maker-Checker
    description: Antrean persetujuan berlapis.
  - name: Dokumen
    description: Berkas cetak (slip, perjanjian kredit, tanda terima).
paths:
  /healthz:
    get:
      tags: [Kesehatan]
      operationId: healthz
      summary: Health check proses
      description: |-
        Publik, tanpa autentikasi (izin: —). Mengembalikan `{"status":"UP"}`.
      security: []
      responses:
        "200":
          description: Proses hidup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/v1/app-info:
    get:
      tags: [Aplikasi]
      operationId: getAppInfo
      summary: Identitas aplikasi publik
      description: |-
        Publik, tanpa autentikasi (izin: —). Dipakai halaman login dan metadata tab web.
        Respons di-cache `Cache-Control: public, max-age=60`.
      security: []
      responses:
        "200":
          description: Identitas aplikasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Masuk dan buat sesi
      description: |-
        Publik (izin: —). `username` dan `password` wajib. Token ditulis sebagai cookie
        httpOnly; body hanya memuat `expires_in`, `refresh_expires_in`,
        `password_expired`, dan profil `user`. Percobaan dibatasi per akun dan
        per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Perbarui sesi
      description: |-
        Publik (izin: —). Memprioritaskan cookie refresh; untuk klien non-browser boleh
        mengirim `refresh_token` di body. Cookie sesi dan token CSRF dirotasi.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Sesi diperbarui.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Akhiri sesi
      description: |-
        Tidak di belakang autentikasi agar cookie tetap terhapus walau access
        token kedaluwarsa, tetapi WAJIB lolos CSRF. Pencabutan sesi best-effort
        bila token masih sah. Izin: — (CSRF wajib).
      responses:
        "200":
          description: Sesi diakhiri.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Profil pengguna aktif
      description: |-
        Autentikasi wajib. Mengembalikan identitas, cakupan buku, `active_books`,
        daftar izin efektif, dan menu yang berasal dari database. Izin: —.
      responses:
        "200":
          description: Profil pengguna.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/staff/:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: Daftar pegawai
      description: "Izin: `users:read`."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Daftar pegawai.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Staff]
      operationId: createStaff
      summary: Buat pegawai
      description: "Izin: `users:create`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/staff/me/change-password:
    post:
      tags: [Staff]
      operationId: changeOwnPassword
      summary: Ganti kata sandi sendiri
      description: "Izin: — (setiap pengguna terautentikasi)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/staff/{id}:
    parameters:
      - $ref: "#/components/parameters/StaffID"
    get:
      tags: [Staff]
      operationId: getStaff
      summary: Detail pegawai
      description: "Izin: `users:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Staff]
      operationId: updateStaff
      summary: Ubah pegawai
      description: "Izin: `users:update`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/staff/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/StaffID"
    post:
      tags: [Staff]
      operationId: resetStaffPassword
      summary: Setel ulang kata sandi pegawai
      description: "Izin: `users:update`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  format: password
              required: [new_password]
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/:
    get:
      tags: [Nasabah]
      operationId: listCustomers
      summary: Daftar nasabah
      description: "Izin: `customers:read`. Mendukung pencarian `q`."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SearchQ"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Nasabah]
      operationId: registerCustomer
      summary: Daftarkan nasabah (CIF)
      description: "Izin: `customers:create`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Nasabah]
      operationId: getCustomer
      summary: Detail nasabah
      description: "Izin: `customers:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Nasabah]
      operationId: updateCustomer
      summary: Ubah data nasabah
      description: "Izin: `customers:update`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/branches/:
    get:
      tags: [Cabang]
      operationId: listBranches
      summary: Daftar cabang
      description: "Izin: `users:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Cabang]
      operationId: createBranch
      summary: Buat cabang
      description: "Izin: `branches:create`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                parent_code:
                  type: string
              required: [code, name]
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/branches/org-units:
    get:
      tags: [Cabang]
      operationId: listOrgUnits
      summary: Daftar unit organisasi
      description: "Izin: `users:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Cabang]
      operationId: createOrgUnit
      summary: Buat unit organisasi
      description: "Izin: `branches:create`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  description: Jenis unit (mis. AREA, WILAYAH).
                parent_code:
                  type: string
              required: [code, name, type]
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/branches/org-units/{code}/parent:
    parameters:
      - $ref: "#/components/parameters/OrgCode"
    put:
      tags: [Cabang]
      operationId: setOrgUnitParent
      summary: Ubah induk unit organisasi
      description: "Izin: `branches:create`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_code:
                  type: string
              required: [parent_code]
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products/:
    get:
      tags: [Produk]
      operationId: listProducts
      summary: Daftar produk
      description: "Izin: `products:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Produk]
      operationId: getProduct
      summary: Detail produk
      description: "Izin: `products:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Kode produk.
        schema:
          type: string
    put:
      tags: [Produk]
      operationId: updateProductParams
      summary: Ubah parameter produk
      description: |-
        Izin: `coa:manage`. Mengubah suku bunga, nisbah, proyeksi pendapatan,
        batas plafon/tenor, dan biaya. Identitas produk tidak diubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/:
    get:
      tags: [Rekening]
      operationId: listAccounts
      summary: Daftar rekening
      description: "Izin: `accounts:read`. Mendukung pencarian `q`."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SearchQ"
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/open:
    post:
      tags: [Rekening]
      operationId: openAccount
      summary: Buka rekening
      description: "Izin: `accounts:open`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                product_code:
                  type: string
                currency:
                  type: string
                initial_deposit:
                  $ref: "#/components/schemas/Money"
              required: [customer_id, product_code]
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/{accountNumber}:
    parameters:
      - $ref: "#/components/parameters/AccountNumber"
    get:
      tags: [Rekening]
      operationId: getAccount
      summary: Detail rekening
      description: "Izin: `accounts:read`."
      responses:
        "200":
          $ref: "#/components/responses/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/{accountNumber}/statements:
    parameters:
      - $ref: "#/components/parameters/AccountNumber"
    get:
      tags: [Rekening]
      operationId: getAccountStatement
      summary: Mutasi rekening
      description: "Izin: `ledger:read`."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Mutasi rekening beserta `meta` paginasi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/{accountNumber}/freeze:
    parameters:
      - $ref: "#/components/parameters/AccountNumber"
    post:
