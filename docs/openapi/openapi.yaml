          type: string
        as_of:
          type: string
          format: date-time
        carrying_amount:
          $ref: "#/components/schemas/Money"
        present_value:
          $ref: "#/components/schemas/Money"
        target:
          $ref: "#/components/schemas/Money"
    MonitoringSnapshot:
      type: object
      description: Potret kesehatan operasional pada satu waktu.
      properties:
        evaluated_at:
          type: string
          format: date-time
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Kode temuan yang stabil untuk filter/otomasi klien.
              severity:
                type: string
                enum: [WARNING, CRITICAL]
              message:
                type: string
        summary:
          type: object
          properties:
            critical:
