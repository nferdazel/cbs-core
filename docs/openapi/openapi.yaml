      description: |-
        Izin: `loans:approve`. Menghitung dan menyimpan `required_ckpn` untuk penempatan
        ber-metode `COLLECTIVE` (CKPN = EAD x PD x LGD, PA BPR Bab XII 12.4.g.2/12.6-12.9).
        Menempatkan asesmen `INDIVIDUAL_*` dilewati; `EXCLUDED_ASET_BAIK` disimpan dengan
        target nol. Selama saklar `ckpn.pabl.enabled` mati, permintaan ditolak `409`;
        parameter PD/LGD yang belum diisi/tidak sah ditolak `422`. Tidak memposting jurnal.
      parameters:
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Tanggal proses; bawaan waktu sekarang (UTC).
