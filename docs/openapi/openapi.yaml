components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT dari `/api/v1/auth/login`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: cbs_access_token
      description: |-
        Cookie sesi httpOnly. Nama dapat diubah lewat `CBS_ACCESS_COOKIE`.
        Permintaan yang mengubah state wajib menyertakan `X-CSRF-Token`.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Halaman (mulai 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Jumlah data per halaman.
      schema:
        type: integer
        minimum: 1
        default: 20
    SearchQ:
      name: q
      in: query
      required: false
      description: Kata kunci pencarian.
      schema:
        type: string
    FromDate:
      name: from
      in: query
      required: false
      description: Tanggal awal (YYYY-MM-DD).
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: false
      description: Tanggal akhir (YYYY-MM-DD).
      schema:
        type: string
        format: date
    AsOfDate:
      name: as_of
      in: query
      required: false
      description: Tanggal proses (YYYY-MM-DD atau RFC3339).
      schema:
        type: string
    Book:
      name: book
      in: query
      required: false
      description: Filter buku lini usaha (mis. CONVENTIONAL, SYARIAH).
      schema:
        type: string
    OJKPeriod:
      name: period
      in: query
      required: true
      description: Periode laporan OJK (YYYY-MM atau YYYYMM).
      schema:
        type: string
    AccountNumber:
      name: accountNumber
      in: path
      required: true
      description: Nomor rekening.
      schema:
        type: string
    StaffID:
      name: id
      in: path
      required: true
      description: UUID pegawai.
      schema:
        type: string
        format: uuid
    ResourceID:
      name: id
      in: path
      required: true
      description: UUID sumber daya.
      schema:
        type: string
        format: uuid
    LoanID:
      name: loanId
      in: path
      required: true
      description: UUID kredit.
      schema:
        type: string
        format: uuid
    LoanNumber:
      name: loanNumber
      in: path
      required: true
      description: Nomor kredit.
      schema:
        type: string
    Reference:
      name: reference
      in: path
      required: true
      description: Nomor referensi jurnal atau transaksi.
      schema:
        type: string
    RefNo:
      name: refNo
      in: path
      required: true
      description: Nomor referensi transaksi.
      schema:
        type: string
    OrgCode:
      name: code
      in: path
      required: true
      description: Kode unit organisasi.
      schema:
        type: string
    CategoryCode:
      name: categoryCode
      in: path
      required: true
      description: Kode kategori agunan.
      schema:
        type: string
  responses:
    OK:
      description: Berhasil.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Created:
      description: Sumber daya dibuat.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    AcceptedPendingApproval:
      description: |-
        Diterima untuk ditinjau maker-checker (`status: PENDING_APPROVAL`),
        bukan kegagalan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    BadRequest:
      description: Permintaan tidak dapat dibaca atau bidang wajib kosong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Token hilang, kedaluwarsa, atau tidak sah.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |-
        Izin tidak cukup, kata sandi kedaluwarsa, atau data di luar cakupan
        cabang/buku aktor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Sumber daya tidak ditemukan (atau disamarkan pada pembacaan lintas cakupan).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Konflik keadaan (duplikat, transaksi sudah dibatalkan, tanggal bisnis bentrok).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Permintaan terbaca tetapi gagal validasi/aturan bisnis.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Terlalu banyak percobaan (pembatasan login/akun terkunci).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: |-
        Kegagalan internal. Detail hanya tercatat di log; klien menerima pesan
        generik.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Envelope:
      type: object
      description: Amplop respons standar.
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        error:
          type: string
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
      required: [success, error]
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    Money:
      type: string
      description: |-
        Nominal desimal sebagai string (mis. `"1000000"`), mengikuti
        `shopspring/decimal`. Hindari float agar presisi rupiah tidak hilang.
      examples: ["1000000"]
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required: [username, password]
    LoginResponse:
      type: object
      description: Token TIDAK diserialisasi ke body; dikirim lewat cookie httpOnly.
      properties:
        expires_in:
          type: integer
          description: Masa berlaku access token (detik).
        refresh_expires_in:
          type: integer
          description: Masa berlaku refresh token (detik).
        password_expired:
          type: boolean
        user:
          $ref: "#/components/schemas/StaffUser"
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
    StaffUser:
