          type: string
          format: password
      required: [old_password, new_password]
    CustomerRequest:
      type: object
      additionalProperties: true
      description: |-
        Data CIF. Bidang inti: `full_name`, `id_card_number`, `phone`,
        `email`, `address`. Validasi duplikat NIK/surel dibalas `409`.
      properties:
        full_name:
          type: string
        id_card_number:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
    DepositRequest:
      type: object
      properties:
        account_number:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: IDR
        description:
          type: string
        idempotency_key:
          type: string
      required: [account_number, amount]
    WithdrawRequest:
      type: object
      properties:
        account_number:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: IDR
        description:
          type: string
        idempotency_key:
          type: string
      required: [account_number, amount]
    TransferRequest:
      type: object
      properties:
        source_account_number:
          type: string
        destination_account_number:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: IDR
        description:
          type: string
        idempotency_key:
          type: string
      required: [source_account_number, destination_account_number, amount]
    ReversalRequest:
      type: object
      description: Nominal diambil dari jurnal asal; hanya alasan yang dikirim.
      properties:
        reason:
          type: string
      required: [reason]
    CustomJournalLine:
      type: object
      properties:
        account_number:
          type: string
        direction:
          type: string
          enum: [D, K]
          description: "`D` = debit, `K` = kredit."
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
      required: [account_number, direction, amount]
    CustomJournalRequest:
      type: object
      properties:
        transaction_type:
          type: string
        description:
          type: string
        idempotency_key:
          type: string
        created_by:
          type: string
          description: Diabaikan; identitas pencatat selalu dari JWT.
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/CustomJournalLine"
      required: [lines]
    CKPNEntryMarkRequest:
      type: object
      description: Penandaan pintu masuk CKPN individual satu kredit (T3).
      properties:
        method:
          type: string
          enum: [DCF, COLLATERAL, MAX, EXCLUDED_ASET_BAIK]
        significant:
          type: boolean
        objective_evidence:
          type: boolean
        excluded_aset_baik:
          type: boolean
      required: [method]
    CKPNCashflowProjection:
      type: object
      properties:
        period:
          type: integer
          minimum: 1
          description: Periode ke-n dalam bulan.
        amount:
          $ref: "#/components/schemas/Money"
      required: [period, amount]
    CKPNProjectionsRequest:
      type: object
      properties:
        projections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CKPNCashflowProjection"
      required: [projections]
    CKPNDisposalCostRequest:
      type: object
      properties:
        disposal_cost:
          description: Nominal biaya pelepasan, atau `null` untuk mengosongkan.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    CKPNIndividualScanResult:
      type: object
      description: |-
        Hasil pemindaian jalur individual. Bentuk rinci dikelola domain
        `CKPNIndividualScanResult`; di sini hanya kontrak amplop yang dijamin.
      additionalProperties: true
    CKPNIndividualEntry:
      type: object
      properties:
        individual:
          type: boolean
        significance:
          type: boolean
        triggers:
          type: array
          items:
            type: string
        suggested_method:
          type: string
          enum: [DCF, COLLATERAL, MAX, EXCLUDED_ASET_BAIK]
        excluded_aset_baik:
          type: boolean
    CKPNIndividualAssessment:
      type: object
      properties:
        loan_id:
          type: string
          format: uuid
        loan_number:
          type: string
        as_of:
          type: string
          format: date-time
        carrying_amount:
          $ref: "#/components/schemas/Money"
        present_value:
          $ref: "#/components/schemas/Money"
        target:
          $ref: "#/components/schemas/Money"
    MonitoringSnapshot:
      type: object
      description: Potret kesehatan operasional pada satu waktu.
      properties:
        evaluated_at:
          type: string
          format: date-time
        findings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Kode temuan yang stabil untuk filter/otomasi klien.
              severity:
                type: string
                enum: [WARNING, CRITICAL]
              message:
                type: string
        summary:
          type: object
          properties:
            critical:
              type: integer
            warning:
              type: integer
