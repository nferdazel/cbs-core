                saldo_pokok_per_posisi: { type: string, description: "Kolom VIII.c (rupiah penuh)." }
                bunga_saat_hapus: { type: string, description: "Kolom IX.a (rupiah penuh)." }
                bunga_akum_tertagih: { type: string, description: "Kolom IX.b (rupiah penuh)." }
                bunga_akum_tambahan: { type: string, description: "Kolom IX.c (rupiah penuh)." }
                bunga_per_posisi: { type: string, description: "Kolom IX.d (rupiah penuh)." }
                agunan_jenis_code: { type: string, description: "Kolom X.a: sandi Lampiran 01; tanpa agunan = 299." }
