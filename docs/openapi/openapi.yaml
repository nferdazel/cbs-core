    CustomerRequest:
      type: object
      additionalProperties: true
      description: |-
        Data CIF. Bidang inti: `full_name`, `id_card_number`, `phone`,
        `email`, `address`. Validasi duplikat NIK/surel dibalas `409`.
        `PUT` juga menerima sandi referensi/inline OJK opsional (Form 06.00):
        `ojk_pihak_lawan_code` (XVIII, FK `ojk_pihak_lawan`),
        `ojk_sektor_ekonomi_code` (XX, FK `ojk_sektor_ekonomi`), dan
        `ojk_hubungan_bank_code` (IX, inline 11/12/20). Bidang yang tidak dikirim
        dipertahankan; string kosong mengosongkan (belum diisi).
      properties:
        full_name:
          type: string
        id_card_number:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        ojk_pihak_lawan_code:
          type: string
          nullable: true
        ojk_sektor_ekonomi_code:
          type: string
          nullable: true
        ojk_hubungan_bank_code:
          type: string
          nullable: true
    DepositRequest:
      type: object
      properties:
        account_number:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: IDR
        description:
          type: string
        idempotency_key:
          type: string
      required: [account_number, amount]
    WithdrawRequest:
      type: object
      properties:
        account_number:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: IDR
        description:
          type: string
        idempotency_key:
          type: string
      required: [account_number, amount]
    TransferRequest:
      type: object
      properties:
        source_account_number:
          type: string
        destination_account_number:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: IDR
        description:
          type: string
        idempotency_key:
          type: string
      required: [source_account_number, destination_account_number, amount]
    ReversalRequest:
      type: object
      description: Nominal diambil dari jurnal asal; hanya alasan yang dikirim.
      properties:
        reason:
          type: string
      required: [reason]
    CustomJournalLine:
      type: object
      properties:
        account_number:
          type: string
        direction:
          type: string
          enum: [D, K]
          description: "`D` = debit, `K` = kredit."
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
      required: [account_number, direction, amount]
    CustomJournalRequest:
      type: object
      properties:
        transaction_type:
          type: string
        description:
          type: string
        idempotency_key:
          type: string
        created_by:
          type: string
          description: Diabaikan; identitas pencatat selalu dari JWT.
        lines:
          type: array
